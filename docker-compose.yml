services:
  db:
    image: postgres:16
    container_name: sefaz_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/scripts:/docker-entrypoint-initdb.d/
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always
    networks:
      - sefaz-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_sefaz
    command: start-dev
    environment:
      KEYCLOAK_CLIENT_ID: sefaz-backend
      KEYCLOAK_CLIENT_SECRET_KEY: PWcvh8qMpiEhueZSh83kvi9H1V9CZ6aE
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always
    networks:
      - sefaz-net

  backend:
    build: ./backend
    container_name: sefaz_backend
    command: gunicorn sefaz_projeto.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - staticfiles_volume:/app/staticfiles
      - /etc/localtime:/etc/localtime:ro
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      - db
      - keycloak
    restart: always
    networks:
      - sefaz-net

  celery:
    build: ./backend
    container_name: sefaz_celery
    command: celery -A sefaz_projeto worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    restart: always
    networks:
      - sefaz-net

  redis:
    image: redis:7-alpine
    container_name: redis_sefaz
    restart: always
    networks:
      - sefaz-net
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
        - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
        - VITE_KEYCLOAK_CLIENT=${VITE_KEYCLOAK_CLIENT}
    container_name: nginx_sefaz
    ports:
      - "80:80"
    volumes:
      - staticfiles_volume:/app/backend/staticfiles
    depends_on:
      - backend
    restart: always
    networks:
      - sefaz-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_sefaz
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always
    networks:
      - sefaz-net

networks:
  sefaz-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  staticfiles_volume: