services:
  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn sefaz_projeto.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    env_file:
      - .env
    volumes:
      - staticfiles_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - backend-net

  nginx:
    build:
      context: .
      dockerfile: ./backend/nginx/Dockerfile
    container_name: nginx_sefaz
    volumes:
      - staticfiles_volume:/app/staticfiles
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - frontend-net
      - backend-net

  celery:
    build:
      context: ./backend
    command: celery -A sefaz_projeto worker -l info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - backend-net

  db:
    image: postgres:16
    container_name: db_sefaz
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    restart: always
    networks:
      - backend-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_sefaz
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  redis:
    image: redis:7
    container_name: redis_sefaz
    restart: always
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_sefaz
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  staticfiles_volume: