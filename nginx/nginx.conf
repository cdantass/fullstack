# /nginx/nginx.conf (ou similar)

server {
    listen 80;
    server_name localhost;

    # ... (o seu location / { ... } para o React deve continuar aqui)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- ADICIONE ESTE BLOCO NOVO ---
    # Isto atua como um "tradutor" (proxy)
    # Pedidos para /keycloak/ serão enviados para o contêiner keycloak:8080
    location /keycloak/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ... (o seu location /api/ { ... } para o Django deve continuar aqui)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}