server {
    listen 80;
    server_name localhost;

    # Rota para a nossa API backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- NOVA REGRA ADICIONADA AQUI ---
    # Rota para o Django Admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota para os ficheiros estáticos do Django (incluindo o CSS do admin)
    location /static/ {
        # Este caminho corresponde ao volume 'staticfiles_volume' no docker-compose.yml
        alias /app/backend/staticfiles/;
    }

    # Rota principal para servir a aplicação React
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}